<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rispa.ai</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // Converts a 404 URL into a query param so index.html can read it.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) +
        (l.hash || '')
      );
    </script>
  </head>
  <body></body>
</html>
